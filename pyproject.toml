[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genml_kit"
version = "0.1.0"
description = "General-purpose ML toolkit: image-classification training, self-supervised pre-training, and XGBoost ensemble inference."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "transformers",
    "datasets",
    "xgboost>=2.0",
    "scikit-learn",
    "pillow",
    "tensorboard",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage"]
s3 = ["boto3>=1.28"]
lora = ["peft>=0.7.0"]
timm = ["timm>=1.0"]
uvito = ["segmentation_models_pytorch>=0.3.0"]
all = ["genml_kit[gcs,s3,lora,timm,uvito]"]
dev = ["pytest", "ruff", "yapf"]

[project.scripts]
genml-kit-train = "genml_kit.training.train:main"
genml-kit-pretrain = "genml_kit.pretrain.cli:main"
genml-kit-infer = "genml_kit.training.infer:main"

[tool.setuptools.packages.find]
include = ["genml_kit*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
ignore = ["LOG015", "PLC0415", "RUF012", "PLR0402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error",
  # Known sandbox limitation: joblib falls back to serial mode when a
  # shared-memory segment cannot be created. Fires at test collection.
  "ignore:\\[Errno 13\\] Permission denied.*joblib:UserWarning",
]
