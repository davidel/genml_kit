[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genml_kit"
version = "0.2.1"
description = "General-purpose ML toolkit: image-classification, visual-odometry and self-supervised pre-training through one unified harness."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "transformers",
    "datasets",
    "xgboost>=2.0",
    "scikit-learn",
    "pillow",
    "tensorboard",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage"]
s3 = ["boto3>=1.28"]
lora = ["peft>=0.7.0"]
llm = ["peft>=0.7.0"]
llm-spm = ["sentencepiece>=0.1.99"]
timm = ["timm>=1.0"]
uvito = ["segmentation_models_pytorch>=0.3.0"]
rl = ["gymnasium>=0.29", "pygame>=2.1", "imageio[ffmpeg]>=2.31", "box2d>=2.3.10"]
all = ["genml_kit[gcs,s3,lora,llm,llm-spm,timm,uvito,rl]"]
dev = ["pytest", "ruff", "yapf", "pyyaml"]

[project.urls]
Homepage = "https://github.com/davidel/genml_kit"
Repository = "https://github.com/davidel/genml_kit"
Issues = "https://github.com/davidel/genml_kit/issues"

[project.scripts]
genml-kit-train = "genml_kit.training.train:main"
genml-kit-infer = "genml_kit.training.infer:main"
genml-kit-llm = "genml_kit.llm_cli:main"

[tool.setuptools.packages.find]
include = ["genml_kit*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
# I001 (import sorting) is disabled: ruff's isort forces 4-space
# continuation indents inside parenthesized imports, while the project's
# yapf config (.style.yapf, Google style, 2-space base) wraps them with
# 2-space continuation.  yapf is authoritative for indentation.
ignore = ["I001", "LOG015", "PLC0415", "RUF012", "PLR0402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not slow and not network and not service'"
markers = [
  "slow: long-running learning/convergence tests (deselected by default; run with -m slow)",
  "network: command downloads models/data over the internet (deselected by default)",
  "service: command needs an external service, satisfied by its credentials or an endpoint-override proxy/emulator (implies network; deselected by default)",
  "hf: service marker for HuggingFace (HF_TOKEN / HUGGING_FACE_HUB_TOKEN or HF_ENDPOINT)",
  "s3: service marker for AWS S3 (AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY or AWS_ENDPOINT_URL_S3 / AWS_ENDPOINT_URL)",
  "r2: service marker for Cloudflare R2 (R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY or R2_ENDPOINT_URL / AWS_ENDPOINT_URL_S3)",
  "gcs: service marker for Google Cloud Storage (GOOGLE_APPLICATION_CREDENTIALS or STORAGE_EMULATOR_HOST)",
  "github: service marker for GitHub (GITHUB_TOKEN / GH_TOKEN or GITHUB_API_URL)",
  "wandb: service marker for Weights & Biases (WANDB_API_KEY or WANDB_BASE_URL)",
]
filterwarnings = [
  "error",
  # Known sandbox limitation: joblib falls back to serial mode when a
  # shared-memory segment cannot be created. Fires at test collection.
  "ignore:\\[Errno 13\\] Permission denied.*joblib:UserWarning",
]
