name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev,llm,llm-spm,timm,uvito,lora,s3,rl]"

      - name: Run Ruff
        run: ruff check .

      - name: Check Markdown math
        run: python scripts/md_latex.py

      - name: Run tests
        run: pytest -q

      - name: Run slow tests
        run: pytest -q -m 'slow and not network and not hf'

  # README CLI examples that need the internet but NO credentials.
  # Every resource referenced by the READMEs (cifar10, google/vit-*,
  # sshleifer/tiny-gpt2, timm/*, marmal88/skin_cancer, scene_parse_150, ...)
  # is public and un-gated, so this job runs token-free -- no HF_TOKEN secret.
  #
  # If a gated resource is ever added (the only case that needs credentials),
  # do NOT hardcode a token.  Use a HuggingFace OIDC "trusted publisher"
  # instead: grant `id-token: write` below and exchange the GitHub OIDC token
  # for a short-lived, read-only Hub token at job start, e.g.
  #   env: { HF_OIDC_RESOURCE: <hf-username> }
  #   run: echo "HF_TOKEN=$(hf auth token)" >> "$GITHUB_ENV"
  # See docs/TEST_CLI_EXAMPLES.md s 8 (CI integration).
  readme-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev,llm,llm-spm,timm,uvito,lora,s3,rl]"

      - name: Run README CLI examples (tokenless network)
        run: |
          set +e
          pytest -q -m 'network and not hf'
          code=$?
          # Exit code 5 == "no tests collected": not an error while the
          # marker suite is still being populated.
          if [ "$code" -eq 5 ]; then
            echo "No network README CLI tests collected yet."
            exit 0
          fi
          exit "$code"
