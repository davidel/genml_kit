name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev,timm,uvito,lora,s3,rl]"

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Run slow tests
        run: pytest -q -m slow
