name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev,llm,llm-spm,timm,uvito,lora,s3,rl]"

      - name: Run Ruff
        run: ruff check .

      - name: Check Markdown math
        run: python scripts/md_latex.py

      - name: Run tests
        run: pytest -q

      - name: Run slow tests
        run: pytest -q -m 'slow and not network and not hf'

  readme-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev,llm,llm-spm,timm,uvito,lora,s3,rl]"

      - name: Run README CLI examples (tokenless network)
        run: |
          set +e
          pytest -q -m 'network and not hf'
          code=$?
          # Exit code 5 == "no tests collected": not an error while the
          # marker suite is still being populated.
          if [ "$code" -eq 5 ]; then
            echo "No network README CLI tests collected yet."
            exit 0
          fi
          exit "$code"

      - name: Run README CLI examples (gated / HF_TOKEN)
        env:
          # Gated datasets need a token whose owner has been granted access.
          # On forks without the secret the spec skips, so this never
          # hard-fails for lack of a token.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          pytest -q -m 'hf'
          code=$?
          # Exit code 5 == "no tests collected": not an error while the
          # marker suite is still being populated.
          if [ "$code" -eq 5 ]; then
            echo "No hf README CLI tests collected yet."
            exit 0
          fi
          exit "$code"
