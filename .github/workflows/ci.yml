name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Bound the job against a hung test.  A wedge would otherwise ride the
    # GitHub default (360 min) until the runner SIGTERMs the step, which
    # surfaces as a bare "exit code 143" with no logs.  Sized for a full
    # default + slow run, not the runner's ceiling.
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev,llm,llm-spm,timm,uvito,lora,s3,rl]"

      - name: Run Ruff
        run: ruff check .

      - name: Check Markdown math
        run: python scripts/md_latex.py

      - name: Run tests
        run: pytest -q

      - name: Run slow tests
        # ``distributed`` (the multi-process torchrun example) is opted out of
        # the default suite via addopts; an explicit -m overrides that, so it
        # must be deselected here too.  It runs in its own README-CLI step.
        run: pytest -q -m 'slow and not network and not service and not distributed'

  readme-cli:
    runs-on: ubuntu-latest
    # Same bound as the ``test`` job: the README examples can wedge (torchrun,
    # downloads); fail on a clear timeout instead of a bare SIGTERM/143.
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev,llm,llm-spm,timm,uvito,lora,s3,rl]"

      - name: Run README CLI examples (tokenless network)
        run: bash .github/workflows/readme_cli_suite.sh network

      - name: Run README CLI examples (distributed / torchrun)
        run: bash .github/workflows/readme_cli_suite.sh distributed

      - name: Run README CLI examples (gated / HF_TOKEN)
        env:
          # Gated datasets need a token whose owner has been granted access.
          # On forks without the secret the spec skips, so this never
          # hard-fails for lack of a token.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash .github/workflows/readme_cli_suite.sh service

      - name: Run README CLI examples (proxied / emulated services)
        env:
          # Optional repo variables pointing the clients at a proxy or
          # emulator.  When unset the corresponding spec skips, so this
          # never hard-fails for lack of an endpoint.
          HF_ENDPOINT: ${{ vars.HF_ENDPOINT }}
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
          AWS_ENDPOINT_URL: ${{ vars.AWS_ENDPOINT_URL }}
          STORAGE_EMULATOR_HOST: ${{ vars.STORAGE_EMULATOR_HOST }}
          GITHUB_API_URL: ${{ vars.GITHUB_API_URL }}
          WANDB_BASE_URL: ${{ vars.WANDB_BASE_URL }}
        run: bash .github/workflows/readme_cli_suite.sh proxied
